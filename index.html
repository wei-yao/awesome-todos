<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Little Focus · 待办与番茄钟</title>
  <style>
    :root {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color-scheme: light;
      color: var(--ink);
      background: var(--background);
      font-synthesis: none;
      --background: #f7f7f2;
      --surface: #fffefa;
      --ink: #30312e;
      --muted: #696b61;
      --line: #e9eae2;
      --control-line: #818575;
      --accent: #586b48;
      --accent-soft: #eef2e7;
      --timer: #f0ede5;
      --primary: #586b48;
      --on-primary: #ffffff;
      --primary-hover: #60754f;
      --danger: #a52b2b;
      --danger-soft: #fceeee;
      --shadow: 0 8px 32px #363c2305;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; font-size: 15px; line-height: 1.6; }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:disabled, select:disabled, input:disabled { cursor: not-allowed; color: var(--muted); opacity: 1; }
    button:disabled { background: var(--timer); }
    select, input[type="date"] { color-scheme: inherit; }
    select option, select optgroup { background: var(--surface); color: var(--ink); }
    button:hover:not(:disabled), .backup-controls label:hover { background-color: var(--timer); }
    button { -webkit-tap-highlight-color: transparent; }
    button, input, select, textarea { outline-offset: 4px; accent-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); }
    button { transition: background-color .16s ease-out, color .16s ease-out; }
    main { width: min(520px, calc(100% - 40px)); margin: 56px auto 40px; }
    .heading { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: clamp(24px, 6vw, 30px); letter-spacing: -.03em; font-weight: 600; line-height: 1.4; margin: 0; text-wrap: balance; }
    .date { color: var(--muted); font-size: 12px; }
    .subtitle { color: var(--muted); margin: 8px 0 32px; font-size: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .tasks-card { padding: 0 0 8px; background: transparent; border: 0; border-radius: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { font-size: 15px; font-weight: 650; margin: 0; }
    .count { color: var(--muted); font-size: 12px; }
    .task-filters { display: flex; gap: 6px; margin-top: 14px; }
    .task-filters button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; padding: 6px; background: transparent; color: var(--muted); font-size: 13px; }
    .task-filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .add-form { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-top: 14px; padding-bottom: 13px; }
    .add-form input { min-width: 0; flex: 1; border: 0; background: transparent; color: var(--ink); padding: 8px 0; font-size: 14px; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    .add-btn { width: 34px; height: 34px; align-self: center; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 10px; font-size: 24px; line-height: 1; }
    .add-btn:hover { background: var(--line); }
    .task-list { list-style: none; margin: 0; padding: 4px 0; }
    .task + .task { border-top: 1px solid var(--line); }
    .task-row, .step-row { display: flex; align-items: center; gap: 11px; min-height: 62px; }
    .completion { display: grid; place-items: center; position: relative; flex: 0 0 23px; min-height: 34px; cursor: pointer; }
    .completion input { position: absolute; width: 22px; height: 22px; opacity: 0; margin: 0; cursor: pointer; }
    .check { display: grid; place-items: center; flex: 0 0 21px; height: 21px; border: 1.5px solid var(--control-line); border-radius: 7px; transition: background .25s, border-color .25s, transform .25s; }
    .check svg { width: 14px; fill: none; stroke: var(--surface); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .28s .06s; }
    .completion input:checked + .check { background: var(--accent); border-color: var(--accent); }
    .completion input:checked + .check svg { stroke-dashoffset: 0; }
    .completion input:focus-visible + .check { outline: 2px solid var(--accent); outline-offset: 4px; }
    .task-text { min-width: 0; overflow-wrap: anywhere; font-size: 14px; transition: color .25s; text-decoration: line-through transparent; text-decoration-thickness: 1px; }
    .is-done > .task-title .task-text, .is-done > .task-text { color: var(--muted); text-decoration-color: var(--muted); }
    .task-title { display: flex; flex: 1; min-width: 0; gap: 8px; align-items: center; text-align: left; padding: 13px 0; border: 0; background: transparent; }
    .task-title-copy { min-width: 0; flex: 1; }
    .task-title .task-text { display: block; }
    .task-progress { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .chevron { width: 12px; height: 12px; flex-shrink: 0; fill: none; stroke: var(--muted); stroke-width: 1.5; transition: transform .2s; }
    .task-title[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .task-panel { margin: 0 0 16px 34px; border-top: 1px solid var(--line); padding: 14px 0 0; }
    .panel-heading { color: var(--muted); font-size: 11px; font-weight: 600; margin: 0; }
    .step-list { list-style: none; padding: 0; margin: 4px 0 0; }
    .step + .step { border-top: 1px solid var(--line); }
    .step-row { min-height: 46px; gap: 8px; }
    .step-row > .task-text { flex: 1; font-size: 13px; }
    .deadline-status { display: block; font-size: 11px; color: var(--muted); }
    .deadline-status.is-today { color: var(--accent); }
    .deadline-status.is-overdue { color: var(--danger); }
    .deadline-field { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .deadline-input { min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; background: transparent; color: var(--ink); }
    .deadline-clear { border: 0; border-radius: 7px; padding: 4px 7px; background: transparent; color: var(--muted); font-size: 11px; }
    .step .check { width: 18px; height: 18px; border-radius: 6px; flex-basis: 18px; }
    .step .icon-btn { width: 27px; }
    .notes-field { display: block; font-size: 11px; color: var(--muted); margin-top: 12px; }
    .notes-input { display: block; width: 100%; min-height: 66px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font-size: 13px; line-height: 1.6; padding: 9px 10px; margin-top: 5px; }
    .step-form { margin-top: 6px; border-bottom: 0; padding-bottom: 0; gap: 6px; }
    .step-form input { width: 0; font-size: 13px; }
    .step-form .add-btn { width: 29px; height: 29px; font-size: 21px; }
    .focus-target { margin: 10px 0 0; color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
    .task-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn { border: none; background: transparent; color: var(--muted); border-radius: 8px; width: 34px; height: 40px; display: grid; place-items: center; }
    .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
    .delete-btn:hover:not(:disabled) { color: var(--danger) !important; background: var(--danger-soft) !important; }
    .empty { margin: 20px 0; font-size: 13px; color: var(--muted); text-align: center; }
    .focus-card { margin-top: 24px; padding: 24px; }
    .focus-label { display: flex; align-items: center; gap: 7px; }
    .timer-status { color: var(--muted); font-size: 12px; }
    .mode-tabs { display: flex; padding: 4px; background: var(--timer); border-radius: 10px; margin-top: 20px; gap: 4px; }
    .mode-tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 7px; padding: 6px; color: var(--muted); background: transparent; font-size: 13px; }
    .mode-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px #00000008; }
    .focus-input { display: block; width: 100%; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; padding: 10px 11px; height: 43px; margin-top: 12px; }
    .timer-area { text-align: center; padding: 28px 0 24px; }
    .timer-ring { width: min(204px, 100%); aspect-ratio: 1; margin: auto; position: relative; display: grid; place-items: center; }
    .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 3; }
    .ring-track { stroke: var(--line); }
    .ring-progress { stroke: var(--control-line); stroke-linecap: round; transition: stroke-dashoffset .7s linear; }
    .time { display: block; font-size: 48px; line-height: 1.2; font-weight: 450; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
    .timer-caption { font-size: 11px; color: var(--muted); margin-top: 7px; letter-spacing: 1px; }
    .duration { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px; }
    .duration button { min-height: 40px; border: 0; border-radius: 8px; padding: 6px 10px; background: transparent; font-size: 12px; color: var(--muted); }
    .duration button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
    .controls { display: flex; align-items: center; gap: 9px; }
    .primary { flex: 1; border: 0; background: var(--primary); color: var(--on-primary); border-radius: 11px; padding: 11px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .primary:hover:not(:disabled) { background: var(--primary-hover); }
    .primary svg { width: 14px; height: 14px; fill: currentColor; }
    .secondary { border: 1px solid var(--line); background: transparent; border-radius: 11px; padding: 10px 13px; font-size: 13px; }
    .finish { display: block; margin: 12px auto 0; font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 3px 10px; }
    .finish:hover { color: var(--accent); }
    .support { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .support p { margin: 0 0 8px; }
    .quiet-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .quiet-actions button { min-height: 40px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: inherit; padding: 6px 10px; font-size: 12px; }
    .support .quiet-actions button { border: 0; padding: 4px 8px; margin-left: -8px; }
    .settings-card { padding: 24px; }
    .motto-list { list-style: none; margin: 16px 0; padding: 0; }
    .motto-item { border-top: 1px solid var(--line); padding: 20px 0; }
    .motto-item textarea { min-height: 60px; }
    .motto-item select { max-width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
    .settings-copy { font-size: 12px; color: var(--muted); }
    .settings-copy.error { color: var(--danger); }
    .rest-prompt { margin-top: 14px; font-size: 13px; color: var(--ink); }
    .rest-suggestion { margin-top: 14px; font-size: 12px; color: var(--muted); }
    .rest-suggestion p { margin: 0 0 8px; }
    .history { padding: 32px 0 0; }
    .history h2 { font-size: 13px; }
    .history-total { font-size: 11px; color: var(--muted); }
    .history-list { list-style: none; padding: 0; margin: 12px 0 0; }
    .history-item { display: flex; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .history-icon { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 2px 7px; font-size: 13px; }
    .history-copy { flex: 1; min-width: 0; }
    .history-name { font-size: 13px; overflow-wrap: anywhere; }
    .history-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .history-minutes { color: var(--muted); white-space: nowrap; font-size: 12px; padding-top: 2px; }
    footer { text-align: center; font-size: 11px; color: var(--muted); padding-top: 30px; }
    .leaf { color: var(--accent); margin-right: 4px; }
    .notice { margin: 0 0 18px; border-radius: 10px; padding: 10px 12px; font-size: 13px; background: var(--accent-soft); color: var(--ink); }
    .notice.error { color: var(--danger); background: var(--danger-soft); }
    .cloud-controls, .backup-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
    .cloud-controls { margin-top: 8px; justify-content: flex-start; }
    .cloud-controls button, .cloud-controls a, .cloud-controls select, .backup-controls button, .backup-controls label { font: inherit; font-size: 11px; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; text-decoration: none; }
    .backup-controls { margin-top: 14px; }
    .deadline-input, .notes-input, .focus-input, .secondary, .quiet-actions button, .motto-item select,
    .cloud-controls button, .cloud-controls a, .cloud-controls select, .backup-controls button, .backup-controls label { border-color: var(--control-line); }
    [inert] { cursor: not-allowed; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      main { margin-top: 32px; }
      .focus-card, .settings-card { padding: 18px; }
      .task-row { gap: 8px; }
      .task-actions { gap: 0; }
      .icon-btn { width: 30px; }
      .task-panel { margin-left: 31px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --background: #181818; --surface: #242424; --ink: #ededed; --muted: #b5b5b5; --line: #414141; --control-line: #909090; --accent: #a5c6b0; --accent-soft: #303030; --timer: #303030; --primary: #dedede; --on-primary: #202020; --primary-hover: #ffffff; --danger: #ffaaaa; --danger-soft: #392626; --shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="heading"><h1>把今天，慢慢做好。</h1></div>
      <p class="subtitle"><span id="today" class="date"></span> · 一次一件事，就很好。</p>
    </header>
    <div id="cloud-bar" class="notice" role="status" aria-live="polite" hidden>
      <span id="cloud-status">正在连接云端…</span>
      <div class="cloud-controls">
        <button id="cloud-retry" type="button" hidden>重试保存</button>
        <button id="cloud-reload" type="button" hidden>加载云端版本</button>
        <a id="cloud-login" href="/" hidden>重新登录</a>
        <button id="logout" type="button">退出登录</button>
      </div>
      <div class="cloud-controls" id="draft-controls" hidden>
        <select id="draft-select" aria-label="未同步草稿"></select>
        <button id="draft-open" type="button">查看草稿</button>
        <button id="draft-export" type="button">导出所选草稿</button>
        <button id="draft-discard" type="button">丢弃所选草稿</button>
      </div>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="home-view">
    <section class="card tasks-card" aria-labelledby="tasks-heading">
      <div class="section-head"><h2 id="tasks-heading">今日待办</h2><span id="task-count" class="count"></span></div>
      <div class="task-filters" role="group" aria-label="任务视图">
        <button id="tasks-all" type="button" aria-pressed="true" aria-controls="task-list">全部</button>
        <button id="tasks-active" type="button" aria-pressed="false" aria-controls="task-list">未完成</button>
        <button id="tasks-completed" type="button" aria-pressed="false" aria-controls="task-list">已完成</button>
      </div>
      <form id="add-form" class="add-form">
        <input id="new-task" aria-label="新任务" placeholder="有什么想完成的小事？" maxlength="200" autocomplete="off" required>
        <button class="add-btn" aria-label="添加任务" type="submit">+</button>
      </form>
      <ul id="task-list" class="task-list"></ul>
      <p id="tasks-empty" class="empty" hidden>留一点空白。准备好时，添加第一件事。</p>
    </section>
    <section class="card focus-card" aria-labelledby="focus-heading">
      <div class="section-head">
        <h2 id="focus-heading" class="focus-label">专注时刻</h2>
        <span id="timer-status" class="timer-status">准备就绪</span>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="专注模式">
        <button id="free-tab" role="tab" aria-selected="true" aria-controls="free-panel" type="button">自由专注</button>
        <button id="task-tab" role="tab" aria-selected="false" aria-controls="task-panel" tabindex="-1" type="button">关联待办</button>
      </div>
      <div id="free-panel" role="tabpanel" aria-labelledby="free-tab">
        <input id="focus-label" class="focus-input" aria-label="专注内容" placeholder="此刻想专注什么？也可以开始后再填" maxlength="200" autocomplete="off">
      </div>
      <div id="task-panel" role="tabpanel" aria-labelledby="task-tab" hidden>
        <select id="focus-task" class="focus-input" aria-label="选择待办任务"></select>
      </div>
      <p id="focus-target" class="focus-target" hidden></p>
      <div class="timer-area">
        <div class="timer-ring">
          <svg class="ring" viewBox="0 0 204 204" aria-hidden="true"><circle class="ring-track" cx="102" cy="102" r="96"/><circle id="ring-progress" class="ring-progress" cx="102" cy="102" r="96" stroke-dasharray="603.186" stroke-dashoffset="0"/></svg>
          <div><output id="time" class="time" aria-label="剩余时间" role="timer" aria-live="off">25:00</output><div id="timer-caption" class="timer-caption">给自己一段不被打扰的时间</div></div>
        </div>
        <div id="duration-controls" class="duration" role="group" aria-label="专注时长">
          <button type="button" data-minutes="15" aria-pressed="false">15 分钟</button>
          <button type="button" data-minutes="25" aria-pressed="true">25 分钟</button>
          <button type="button" data-minutes="30" aria-pressed="false">30 分钟</button>
          <button type="button" data-minutes="45" aria-pressed="false">45 分钟</button>
          <button type="button" data-minutes="50" aria-pressed="false">50 分钟</button>
        </div>
      </div>
      <div class="controls">
        <button id="start" class="primary" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 8 5-8 5z"/></svg><span id="start-text">开始专注</span></button>
        <button id="reset" class="secondary" type="button" disabled>重置</button>
      </div>
      <button id="finish" class="finish" type="button" hidden>结束并记录</button>
      <div id="rest-prompt" class="rest-prompt" hidden>
        <p id="rest-message"></p>
        <div class="quiet-actions">
          <button id="take-break" type="button">休息 5 分钟</button>
          <button id="skip-break" type="button">稍后休息</button>
          <button id="next-focus" type="button" hidden>开始下一段</button>
          <button id="stop-today" type="button" hidden>今天先到这里</button>
        </div>
      </div>
      <div id="rest-suggestion" class="rest-suggestion" hidden>
        <p id="rest-suggestion-text"></p>
        <div class="quiet-actions">
          <button id="suggestion-next" type="button">换个建议</button>
          <button id="suggestion-skip" type="button">跳过建议</button>
        </div>
      </div>
      <aside class="support" aria-label="轻轻提醒">
        <div id="quote-content">
          <p id="support-quote"></p>
          <div class="quiet-actions">
            <button id="quote-next" type="button">换一句</button>
          </div>
        </div>
        <p id="support-error" role="status" hidden></p>
      </aside>
    </section>
    <section class="history" aria-labelledby="history-heading">
      <div class="section-head"><h2 id="history-heading">专注足迹</h2><span id="history-total" class="history-total">每一分钟都算数</span></div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="empty">你的第一段专注，会留在这里。</p>
    </section>
    <footer><span class="leaf">✧</span>小小进展，也是进展。<br><span id="storage-caption">自动保存在此浏览器 · 无需登录</span>
      <div class="backup-controls">
        <button id="motto-settings-open" type="button">格言设置</button>
        <button id="export-backup" type="button">导出 JSON 备份</button>
        <button id="import-backup" type="button">导入备份</button>
        <button id="clear-history" type="button">清空历史</button>
        <input id="backup-file" type="file" accept=".json,application/json" aria-label="选择备份文件" hidden>
      </div>
    </footer>
    </div>
    <section id="settings-view" class="card settings-card" aria-labelledby="settings-heading" hidden>
      <div class="section-head">
        <h2 id="settings-heading" tabindex="-1">格言设置</h2>
        <button id="settings-back" class="secondary" type="button">返回首页</button>
      </div>
      <p class="settings-copy">管理普通和休息格言，云模式随账号同步。每句最多 200 字符，共最多 200 条。修改后请保存。</p>
      <p id="motto-save-status" class="settings-copy" role="status" aria-live="polite"></p>
      <div id="motto-drafts" class="quiet-actions" hidden>
        <select id="motto-draft-select" aria-label="未保存格言草稿"></select>
        <button id="motto-draft-open" type="button">查看草稿</button>
        <button id="motto-draft-discard" type="button">丢弃所选草稿</button>
      </div>
      <form id="motto-form">
        <ul id="motto-list" class="motto-list"></ul>
        <p id="motto-empty" class="settings-copy" hidden>句库是空的。想添加时，再写一句就好。</p>
        <div class="quiet-actions">

      $("ring-progress").style.strokeDashoffset = String(603.186 * (1 - ms / (state.timer?.total || state.duration * 60000)));
      $("timer-status").textContent = active ? (running ? resting ? "休息中" : "专注进行中" : "已暂停") : restFinished ? "休息时间到了" : "准备就绪";
      $("timer-caption").textContent = restFinished ? "不急，按自己的节奏来。" : resting ? "给自己一点缓冲时间" : active ? (running ? "不急，一点一点向前" : "歇一口气，随时继续") : "给自己一段不被打扰的时间";
      $("start-text").textContent = active ? (running ? resting ? "暂停休息" : "暂停专注" : resting ? "继续休息" : "继续专注") : "开始专注";
      $("start").disabled = !active && state.mode === "task" && !focusTarget();
      $("start").hidden = Boolean(prompt);
      $("reset").disabled = !active;
      $("reset").hidden = resting || Boolean(prompt);
      $("finish").hidden = !active;
      $("finish").textContent = resting ? "结束休息" : "结束并记录";
      $("rest-prompt").hidden = !prompt;
      $("rest-message").textContent = restFinished
        ? "休息时间到了。你可以继续，也可以再歇一会儿。"
        : "这段专注完成了。要歇一会儿吗？";
      $("take-break").textContent = restFinished ? "再休息 5 分钟" : "休息 5 分钟";
      $("skip-break").hidden = restFinished;
      $("next-focus").hidden = !restFinished;
      $("next-focus").disabled = state.mode === "task" && !focusTarget();
      $("stop-today").hidden = !restFinished;
      $("free-tab").disabled = active;
      $("task-tab").disabled = active;
      $("focus-task").disabled = active;
      $("focus-label").disabled = resting;
      $("duration-controls").hidden = resting || restFinished;
      $("focus-target").hidden = !active || resting;
      $("focus-target").textContent = active ? state.timer.label : "";
      for (const button of document.querySelectorAll(".focus-item-button")) {
        button.disabled = active || !focusTarget(button.dataset.taskId, button.dataset.stepId);
      }
      for (const button of document.querySelectorAll("[data-minutes]")) {
        button.disabled = active;
        button.setAttribute("aria-pressed", String(Number(button.dataset.minutes) === state.duration));
      }
      document.title = active ? `${$("time").textContent} · Little Focus` : "Little Focus · 待办与番茄钟";
      renderSupport();
    }
    function render() {
      renderTasks();
      renderTaskOptions();
      renderHistory();
      const free = state.mode === "free";
      $("free-tab").setAttribute("aria-selected", String(free));
      $("task-tab").setAttribute("aria-selected", String(!free));
      $("free-tab").tabIndex = free ? 0 : -1;
      $("task-tab").tabIndex = free ? -1 : 0;
      $("free-panel").hidden = !free;
      $("task-panel").hidden = free;
      $("focus-label").value = state.label;
      renderTimer();
      if (settingsOpen && !editorDirty) resetMottoEditor();
    }
    function startTimer(taskId, stepId = "") {
      if (state.timer) {
        return;
      }
      const next = structuredClone(state);
      if (taskId) {
        next.mode = "task";
        next.selectedTask = taskId;
        next.selectedStep = stepId;
      }
      const target = focusTarget(next.selectedTask, next.selectedStep);
      if (next.mode === "task" && !target) {
        notify("先选择一条未完成的待办或步骤。");
        return;
      }
      const total = state.duration * 60000;
      delete next.breakPrompt;
      next.timer = {
        id: uid(), kind: "focus", status: "running", total, remaining: total, endAt: clockNow() + total,
        taskId: next.mode === "task" ? target.task.id : "",
        stepId: next.mode === "task" ? target.step?.id || "" : "",
        label: next.mode === "task"
          ? target.step ? `${target.task.text} › ${target.step.text}` : target.task.text
          : state.label.trim() || "自由专注"
      };
      if (!save(next)) return;
      render();
    }
    function startBreak() {
      if (state.timer) return;
      if (!edit((next) => {
        delete next.breakPrompt;
        next.timer = {
          id: uid(), kind: "break", status: "running", total: 300000, remaining: 300000,
          endAt: clockNow() + 300000, taskId: "", stepId: "", label: "休息"
        };
      })) return;
      render();
    }
    function finishTimer(completed) {
      if (!state.timer) {
        return;
      }
      const timer = state.timer;
      const resting = timer.kind === "break";
      const elapsed = completed ? timer.total : Math.max(0, timer.total - remaining());
      const next = structuredClone(state);
      if (!resting && !next.history.some((h) => h.id === timer.id)) {
        next.history.push({
          id: timer.id, label: timer.label, taskId: timer.taskId, stepId: timer.stepId,
          elapsed,
          endedAt: completed ? timer.endAt : clockNow(), completed
        });
      }
      next.timer = null;
      if (completed) next.breakPrompt = resting ? "finished" : "offer";
      else delete next.breakPrompt;
      if (!save(next)) {
        blockedTimer = timer.id;
        return;
      }
      render();
      if (!storageFailed && !$("notice").classList.contains("error")) {
        if (!completed) notify(resting ? "休息已结束，随时可以再歇一会儿。" : `已记录 ${minutesFormat(elapsed)}。随时可以回来。`);
      }
    }
    function tick() {
      if (deadlineDay !== localDate()) renderDeadlines();
      if (CLOUD && (!cloudReady || cloudFailure)) {
        renderTimer();
        return;
      }
      if (state.timer?.status === "running" && remaining() <= 0 && blockedTimer !== state.timer.id) {
        finishTimer(true);
      } else {
        renderTimer();
      }
    }
    $("add-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = $("new-task").value.trim();
      if (!text) {
        $("new-task").setCustomValidity("请输入任务内容，不能只有空格。");
        $("new-task").reportValidity();
        return;
      }
      if (!edit((next) => { next.tasks.push(newTask(text)); })) return;
      $("new-task").value = "";
      if (taskView === "completed") taskView = "active";
      render();
      $("new-task").focus();
    });
    $("new-task").addEventListener("input", () => $("new-task").setCustomValidity(""));
    for (const view of ["all", "active", "completed"]) {
      $("tasks-" + view).addEventListener("click", () => {
        taskView = view;
        renderTasks();
        renderTimer();
      });
    }
    for (const mode of ["free", "task"]) {
      $(mode + "-tab").addEventListener("click", () => {
        if (!state.timer) {
          if (!edit((next) => { next.mode = mode; })) return;
          render();
        }
      });
      $(mode + "-tab").addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key) && !state.timer) {
          event.preventDefault();
          const next = event.key === "Home" ? "free" : event.key === "End" ? "task" : mode === "free" ? "task" : "free";
          $(next + "-tab").click();
          $(next + "-tab").focus();
        }
      });
    }
    $("focus-label").addEventListener("input", () => {
      if (!edit((next) => {
        next.label = $("focus-label").value;
        if (next.timer && next.timer.kind !== "break" && !next.timer.taskId) next.timer.label = next.label.trim() || "自由专注";
      })) $("focus-label").value = state.label;
    });
    $("focus-task").addEventListener("change", () => {
      const option = $("focus-task").selectedOptions[0];
      if (!edit((next) => {
        next.selectedTask = option?.dataset.taskId || "";
        next.selectedStep = option?.dataset.stepId || "";
      })) renderTaskOptions();
      renderTimer();
    });
    for (const button of document.querySelectorAll("[data-minutes]")) {
      button.addEventListener("click", () => {
        if (!state.timer) {
          if (!edit((next) => { next.duration = Number(button.dataset.minutes); })) return;
          renderTimer();
        }
      });
    }
    $("start").addEventListener("click", () => {
      if (!state.timer) {
        startTimer();
        return;
      }
      if (state.timer.status === "running" && remaining() <= 0) {
        finishTimer(true);
        return;
      }
      if (!edit((next) => {
        if (next.timer.status === "running") {
          next.timer.remaining = remaining();
          next.timer.status = "paused";
        } else {
          next.timer.endAt = clockNow() + next.timer.remaining;
          next.timer.status = "running";
        }
      })) return;
      renderTimer();
    });
    $("reset").addEventListener("click", () => {
      if (!state.timer) {
        return;
      }
      if (state.timer.status === "running" && remaining() <= 0) {
        finishTimer(true);
        return;
      }
      if (!confirm("重置计时？本次专注不会记录到历史。")) {
        return;
      }
      if (!edit((next) => { next.timer = null; })) return;
      render();
    });
    $("finish").addEventListener("click", () => finishTimer(state.timer?.status === "running" && remaining() <= 0));
    $("take-break").addEventListener("click", startBreak);
    for (const id of ["skip-break", "stop-today"]) {
      $(id).addEventListener("click", () => {
        if (state.timer) return;
        if (!edit((next) => { delete next.breakPrompt; })) return;
        render();
      });
    }
    $("next-focus").addEventListener("click", () => startTimer());
    $("motto-settings-open").addEventListener("click", openMottoSettings);
    $("settings-back").addEventListener("click", () => {
      settingsOpen = false;
      $("settings-view").hidden = true;
      $("home-view").hidden = false;
      if (editorDirty && !$("notice").classList.contains("error")) notify("格言编辑尚未保存，返回设置可继续；保存后才会同步。", true);
      $("motto-settings-open").focus();
    });
    $("motto-add").addEventListener("click", () => {
      if (editorItems.length >= 200) {
        editorFailure = "最多 200 条格言，请先删除不需要的条目。";
        updateEditorStatus();
        return;
      }
      editorItems.push({ id: uid(), pool: "focus", text: "" });
      preserveEditor();
      renderMottoEditor();
      $("motto-list").querySelectorAll("textarea")[$("motto-list").querySelectorAll("textarea").length - 1].focus();
    });
    $("motto-form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!sameState(mottos(), editorBase)) {
        editorFailure = "句库已在其他页面或设备变更，未覆盖。请先导出编辑草稿，再加载当前句库并重新修改。";
        updateEditorStatus();
        return;
      }
      if (!edit((next) => { next.mottos = structuredClone(editorItems); })) {
        editorFailure = $("notice").textContent;
        updateEditorStatus();
        return;
      }
      editorBase = structuredClone(mottos());
      // Keep the input snapshot if browser persistence failed; cloud drafts are handled by save().
      if (storageFailed || $("notice").classList.contains("error")) {
        editorFailure = $("notice").textContent;
        updateEditorStatus();
      } else {
        removeEditorDraft();
        editorDirty = false;
        editorFailure = "";
      }
      renderSupport(true);
      updateEditorStatus();
    });
    $("motto-reset-editor").addEventListener("click", () => {
      if (editorDirty && !confirm("放弃当前编辑并加载当前句库？可先导出编辑草稿。")) return;
      removeEditorDraft();
      resetMottoEditor();
    });
    $("motto-export-editor").addEventListener("click", () => {
      downloadBackup(JSON.stringify({ ...state, mottos: editorItems }));
    });
    $("motto-draft-open").addEventListener("click", () => {
      if (editorDirty) preserveEditor();
      loadEditorDraft($("motto-draft-select").value);
    });
    $("motto-draft-discard").addEventListener("click", () => {
      const key = $("motto-draft-select").value;
      if (!key.startsWith(EDITOR_PREFIX) || !confirm("永久丢弃所选格言编辑草稿？请先导出备份。")) return;
      try {
        localStorage.removeItem(key);
        if (key === editorKey) editorKey = "";
      } catch (error) {
        console.error("Unable to discard motto editor draft", error);
        editorFailure = "无法丢弃所选草稿，原始内容仍保留。";
      }
      updateEditorStatus();
    });
    $("quote-next").addEventListener("click", () => {
      const pool = supportPool();
      const entries = poolMottos(pool);
      const index = entries.findIndex((entry) => entry.id === support[pool].id);
      const entry = availableQuote(pool, index + 1);
      if (!entry) return;
      support[pool] = { window: quoteWindow(), id: entry.id, text: entry.text };
      saveSupport();
      renderSupport(true);
    });
    $("suggestion-next").addEventListener("click", () => {
      support.suggestion = (support.suggestion + 1) % restSuggestions.length;
      saveSupport();
      renderSupport();
    });
    $("suggestion-skip").addEventListener("click", () => {
      if (!state.timer || state.timer.kind !== "break") return;
      support.skipId = state.timer.id;
      saveSupport();
      renderSupport();
    });
    window.addEventListener("storage", (event) => {
      if (settingsOpen && (event.key === null || event.key.startsWith(EDITOR_PREFIX))) updateEditorStatus();
      if (event.key === SUPPORT_KEY || event.key === null) {
        const frozenSelection = state.timer && state.timer.kind !== "break" ? support.focus : null;
        support = loadSupport();
        if (frozenSelection) support.focus = frozenSelection;
        renderSupport();
      }
      if (CLOUD && (event.key === null || event.key === DRAFT_KEY || event.key.startsWith(DRAFT_PREFIX))) {
        updateDraftOptions();
      }
      if (event.key === STORAGE_KEY || event.key === null) {
        if (CLOUD) {
          if (!cloudBusy && !cloudPending && !cloudFlight && !cloudFailure) {
            void refreshCloud();
          }
          return;
        }
        state = load();
        render();
        tick();
      }
    });
    function downloadBackup(content) {
      const blob = new Blob([content], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `little-focus-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    $("export-backup").addEventListener("click", () => downloadBackup(JSON.stringify(state)));
    $("clear-history").addEventListener("click", () => {
      if (!confirm("清空所有历史？此操作无法撤销，请先导出 JSON 备份。")) return;
      if (edit((next) => { next.history = []; })) renderHistory();
    });
    $("import-backup").addEventListener("click", () => $("backup-file").click());
    $("backup-file").addEventListener("change", async () => {
      const file = $("backup-file").files[0];
      if (!file) {
        return;
      }
      try {
        if (file.size > MAX_REQUEST_BYTES) {
          throw new Error("备份超过 2 MB，无法导入。");
        }
        const decoded = JSON.parse(await file.text());
        const imported = decoded?.state ?? decoded;
        if (!validState(imported)) {
          throw new Error("备份格式无效，当前数据未更改。");
        }
        if (!confirm("导入任务、步骤和历史？相同 ID 保留现有内容，不导入正在进行的计时。有格言句库时可另行确认恢复。")) {
          return;
        }
        if (CLOUD && (!cloudReady || (cloudFailure && !cloudRejected))) {
          throw new Error("请先恢复云端连接，再导入备份。");
        }
        normalize(imported);
        const next = structuredClone(state);
        const tasks = new Map(next.tasks.map((task) => [task.id, task]));
        const history = new Set(next.history.map((entry) => entry.id));
        let added = 0;
        let stepsAdded = 0;
        for (const task of imported.tasks) {
          if (!tasks.has(task.id)) {
            next.tasks.push(task);
            tasks.set(task.id, task);
            added++;
            stepsAdded += task.steps.length;
          } else {
            const existing = tasks.get(task.id);
            const steps = new Set(existing.steps.map((step) => step.id));
            for (const step of task.steps) {
              if (!steps.has(step.id)) {
                existing.steps.push(step);
                steps.add(step.id);
                stepsAdded++;
              }
            }
          }
        }
        for (const entry of imported.history) {
          if (!history.has(entry.id)) {
            next.history.push(entry);
            history.add(entry.id);
          }
        }
        if (imported.mottos !== undefined && confirm("同时用备份中的格言句库替换当前句库（包括删除记录和空句库）？取消则只导入任务与历史。")) {
          next.mottos = imported.mottos;
        }
        if (!save(next)) return;
        render();
        if (!$("notice").classList.contains("error")) {
          notify(`已导入 ${added} 条任务、${stepsAdded} 个步骤及新增历史。已有 ID 的内容保持不变。`);
        }
      } catch (error) {
        console.error("Backup import failed", error);
        notify(error.message, true);
      } finally {
        $("backup-file").value = "";
      }
    });
    $("cloud-retry").addEventListener("click", () => {
      if (cloudBusy || cloudReading) return;
      cloudFailure = "";
      cloudRejected = false;
      if (!cloudReady) {
        void refreshCloud(true);
      } else {
        void flushCloud();
        if (!cloudPending && !cloudFlight && !cloudBusy) {
          void refreshCloud();
        }
      }
      updateCloudStatus();
    });
    $("cloud-reload").addEventListener("click", async () => {
      if (cloudBusy || cloudReading) return;
      if (!confirm("丢弃当前查看的未同步更改并加载云端？其他草稿保留。请先导出 JSON 备份。")) {
        return;
      }
      const pending = cloudPending;
      const flight = cloudFlight;
      const ready = cloudReady;
      cloudPending = null;
      cloudFlight = null;
      cloudFailure = "";
      cloudReady = false;
      if (await refreshCloud(true, false)) {
        removeDraft(pending);
        removeDraft(flight);
      } else {
        cloudPending = pending;
        cloudFlight = flight;
        cloudReady = ready;
      }
      updateCloudStatus();
    });
    $("draft-open").addEventListener("click", () => {
      if (cloudBusy || cloudReading) return;
      try {
        if ((cloudPending || cloudFlight) && !preserveDraft()) return;
        openDraft($("draft-select").value);
      } catch (error) {
        console.error("Unable to open draft", error);
        notify(error.message, true);
      }
      updateCloudStatus();
    });
    $("draft-export").addEventListener("click", () => {
      try {
        const raw = localStorage.getItem($("draft-select").value);
        if (raw === null) throw new Error("所选草稿已不存在。");
        downloadBackup(raw);
      } catch (error) {
        console.error("Unable to export draft", error);
        notify(error.message, true);
      }
    });
    $("draft-discard").addEventListener("click", () => {
      if (cloudBusy || cloudReading) return;
      try {
        const key = $("draft-select").value;
        if ([cloudPending, cloudFlight].some((draft) => draft && (key === DRAFT_PREFIX + draft.mutationId
          || (key === DRAFT_KEY && legacyDraft?.draft.mutationId === draft.mutationId)))) {
          notify("这是当前查看的草稿。请先导出备份，再使用“加载云端版本”明确丢弃。", true);
          return;
        }
        const raw = localStorage.getItem(key);
        if (raw === null || !confirm("永久丢弃所选草稿？请先导出；其他草稿不会删除。")) return;
        if (localStorage.getItem(key) === raw) localStorage.removeItem(key);
        updateDraftOptions();
      } catch (error) {
        console.error("Unable to discard draft", error);
        notify("无法丢弃所选草稿，原数据仍保留。", true);
      }
    });
    $("logout").addEventListener("click", async () => {
      if (cloudPending || cloudFlight || cloudBusy) {
        notify("还有未同步更改，请先保存或导出备份，再退出登录。", true);
        return;
      }
      try {
        await cloudRequest("/api/logout", { method: "POST" });
        localStorage.removeItem(STORAGE_KEY);
        location.replace("/");
      } catch (error) {
        reportCloudError(error);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (CLOUD && !document.hidden) {
        void refreshCloud();
      }
      tick();
    });
    window.addEventListener("beforeunload", (event) => {
      if (editorDirty) {
        event.preventDefault();
        event.returnValue = "";
      }
    });
    $("today").textContent = new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
    render();
    if (CLOUD) {
      updateCloudStatus();
      void refreshCloud(true);
      setInterval(() => {
        if (!document.hidden) {
          void refreshCloud();
        }
      }, 5000);
    } else {
      save();
      tick();
    }
    setInterval(tick, 250);
  </script>
</body>
</html>
